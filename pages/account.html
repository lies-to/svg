  <!-- ===================== small xmas add-on ===================== -->
  <style id="xmas-theme">
    /* Candy-cane filled primary button with shadowed text */
    .xmas-candy {
      background-color: #d42426 !important;
      background-image: linear-gradient(45deg,
        #d42426 25%, #ffffff 25%, #ffffff 50%,
        #d42426 50%, #d42426 75%, #ffffff 75%) !important;
      background-size: 28px 28px !important;
      color: #fff !important;
      text-shadow:
        1px 1px 0 #7d0b0e,
        -1px -1px 0 #7d0b0e,
        1px -1px 0 #7d0b0e,
        -1px 1px 0 #7d0b0e,
        0 2px 4px rgba(0,0,0,0.35);
    }
    /* Keep the fill stable on interaction states */
    .xmas-candy:hover,
    .xmas-candy:focus,
    .xmas-candy:active,
    .xmas-candy:focus-visible {
      background-color: #d42426 !important;
      background-image: linear-gradient(45deg,
        #d42426 25%, #ffffff 25%, #ffffff 50%,
        #d42426 50%, #d42426 75%, #ffffff 75%) !important;
      background-size: 28px 28px !important;
      color: #fff !important;
    }

    /* Light snowfall — identical to the AI page */
    .xmas-snow {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 9998;
      overflow: hidden;
    }
    .xmas-flake {
      position: absolute;
      top: -10px;
      color: #fff;
      font-size: 12px;
      opacity: 0.7;
      text-shadow: 0 0 4px rgba(255,255,255,0.6);
      animation: xmas-fall linear infinite;
      will-change: transform;
    }
    @keyframes xmas-fall {
      0%   { transform: translate3d(0, -10vh, 0) rotate(0deg); }
      100% { transform: translate3d(var(--drift, 20px), 110vh, 0) rotate(360deg); }
    }

    @media (prefers-reduced-motion: reduce) {
      .xmas-flake { animation: none !important; }
      .xmas-snow { display: none; }
    }
  </style>

  <!-- ===================== small xmas add-on script ===================== -->
  <script id="xmas-script">
  (function () {
    var PRIMARY = /save|submit|confirm|continue|copy|redeem|claim|apply|update|sign.?in|log.?in|link|connect/i;

    function labelOf(b) {
      return [
        b.getAttribute('aria-label') || '',
        b.title || '',
        b.id || '',
        typeof b.className === 'string' ? b.className : '',
        b.getAttribute('data-testid') || '',
        (b.textContent || '').trim()
      ].join(' ');
    }

    function isPrimary(b) {
      if (b.type === 'submit') return true;
      if (/\b(primary|btn-primary|button-primary)\b/i.test(typeof b.className === 'string' ? b.className : '')) return true;
      return PRIMARY.test(labelOf(b));
    }

    function decorateButtons() {
      document.querySelectorAll('button, [role="button"], input[type="submit"]').forEach(function (b) {
        if (b.dataset.xmasDone) return;
        b.dataset.xmasDone = '1';
        if (isPrimary(b)) b.classList.add('xmas-candy');
      });
    }

    /* Light snowfall — identical to the AI page */
    (function makeSnow() {
      if (document.getElementById('xmas-snow-host')) return;
      if (window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches) return;

      var host = document.createElement('div');
      host.id = 'xmas-snow-host';
      host.className = 'xmas-snow';
      host.setAttribute('aria-hidden', 'true');
      document.body.appendChild(host);

      var glyphs = ['\u2744', '\u2745', '\u2746', '\u00b7'];
      var count = 18;
      for (var i = 0; i < count; i++) {
        var f = document.createElement('span');
        f.className = 'xmas-flake';
        f.textContent = glyphs[i % glyphs.length];
        f.style.left = (Math.random() * 100) + '%';
        f.style.fontSize = (8 + Math.random() * 10) + 'px';
        f.style.opacity = (0.35 + Math.random() * 0.45).toFixed(2);
        var dur = 12 + Math.random() * 14;
        f.style.animationDuration = dur.toFixed(1) + 's';
        f.style.animationDelay = (-Math.random() * dur).toFixed(1) + 's';
        f.style.setProperty('--drift', (Math.random() * 80 - 40).toFixed(0) + 'px');
        host.appendChild(f);
      }
    })();

    var pending = false;
    function tick() {
      if (pending) return;
      pending = true;
      requestAnimationFrame(function () {
        pending = false;
        decorateButtons();
      });
    }

    new MutationObserver(tick).observe(document.body, { childList: true, subtree: true });
    tick();
  })();
  </script>
